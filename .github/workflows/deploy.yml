name: Deploy demo to GitHub Pages

# Publishes demo/ - the static export of this app. The app at the repository
# root uses Server Actions and a writable SQLite database, so it cannot be
# statically exported and is not what gets deployed here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a running deploy - that can leave the site half-published.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          # Without this, setup-node looks for a lockfile at the repo root.
          cache-dependency-path: demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Runs scripts/sync-assets.mjs via prebuild, then next build.
      - name: Build static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify the export
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/.nojekyll
          test -f out/meals/juicy-cheese-burger/index.html
          # Regression test for the basePath trap: next/image does NOT prefix
          # plain string srcs, so a meal image must come from a static import
          # under /onwards-foodies/_next/. An unprefixed /images/ src would
          # 404 on Pages with no build error at all.
          grep -q 'onwards-foodies/_next/static/media/' out/meals/index.html
          ! grep -rq 'src="/images/' out/

      - uses: actions/upload-pages-artifact@v3
        with:
          # Resolved from the repository root: `working-directory` above
          # applies only to `run` steps, never to `uses` steps.
          path: demo/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
